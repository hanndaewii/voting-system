<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vote</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f1420;
      color: #e8ecf4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #171e2e;
      border: 1px solid #26314a;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    h1 { font-size: 1.4rem; text-align: center; margin-bottom: .3rem; }
    .subtitle { text-align: center; color: #8b96ad; font-size: .85rem; margin-bottom: 1.5rem; }
    label { display: block; font-size: .8rem; color: #8b96ad; margin: .8rem 0 .3rem; }
    input {
      width: 100%;
      padding: .7rem .9rem;
      border-radius: 10px;
      border: 1px solid #2c3a57;
      background: #101728;
      color: #e8ecf4;
      font-size: 1rem;
    }
    input:focus { outline: none; border-color: #2dd4bf; }
    button {
      width: 100%;
      margin-top: 1.2rem;
      padding: .8rem;
      border: none;
      border-radius: 10px;
      background: #14b8a6;
      color: #04211d;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #2dd4bf; }
    button:disabled { opacity: .5; cursor: wait; }
    .option-btn {
      display: block;
      width: 100%;
      margin-top: .7rem;
      padding: 1rem;
      background: #101728;
      color: #e8ecf4;
      border: 1px solid #2c3a57;
      font-weight: 600;
    }
    .option-btn:hover { border-color: #2dd4bf; background: #16223a; }
    .msg { margin-top: 1rem; text-align: center; font-size: .9rem; min-height: 1.2em; }
    .msg.error { color: #f87171; }
    .msg.ok { color: #34d399; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
    .who { font-size: .85rem; color: #8b96ad; }
    .logout {
      width: auto; margin: 0; padding: .35rem .8rem;
      background: transparent; color: #8b96ad;
      border: 1px solid #2c3a57; font-size: .75rem; font-weight: 600;
    }
    .logout:hover { color: #e8ecf4; border-color: #8b96ad; background: transparent; }
    .results { margin-top: 1.5rem; }
    .results h2 { font-size: .95rem; color: #8b96ad; margin-bottom: .8rem; }
    .bar-row { margin-bottom: .9rem; }
    .bar-label { display: flex; justify-content: space-between; font-size: .85rem; margin-bottom: .3rem; }
    .bar { height: 10px; border-radius: 5px; background: #101728; overflow: hidden; }
    .bar > div { height: 100%; background: #14b8a6; border-radius: 5px; transition: width .5s; }
    .hidden { display: none; }
    .center { text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div id="login-view">
      <h1>🗳️ Vote</h1>
      <p class="subtitle">Sign in with your Judge ID</p>
      <form id="login-form">
        <label for="judge-id">Judge ID</label>
        <input id="judge-id" autocomplete="username" placeholder="JUDGE-01" required />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        <button type="submit" id="login-btn">Sign in</button>
      </form>
      <p id="login-msg" class="msg"></p>
    </div>

    <div id="vote-view" class="hidden">
      <div class="topbar">
        <span class="who" id="who"></span>
        <button class="logout" id="logout-btn">Log out</button>
      </div>
      <h1 class="center" style="margin-bottom:1rem">Cast your vote</h1>
      <div id="options"></div>
      <p id="vote-msg" class="msg"></p>
      <div class="results hidden" id="results">
        <h2>Live tally</h2>
        <div id="bars"></div>
        <p class="center" style="color:#8b96ad;font-size:.8rem;margin-top:.5rem" id="total-line"></p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbybWcV_D4nEPbcM_XIAiS5MnUNC3plh1hSr32TdspM15BSK-RD4nD5ki6I1B8zBXqykBw/exec';

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
    }

    const $ = id => document.getElementById(id);
    let creds = null;
    let options = [];
    let voted = false;

    const saved = localStorage.getItem('vote-creds');
    if (saved) {
      try { creds = JSON.parse(saved); } catch (e) { creds = null; }
      if (creds) enterVoteView();
    }

    $('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = $('login-btn');
      btn.disabled = true;
      $('login-msg').textContent = '';
      creds = { judgeId: $('judge-id').value.trim(), password: $('password').value };
      const ok = await loadOptions();
      btn.disabled = false;
      if (ok) {
        localStorage.setItem('vote-creds', JSON.stringify(creds));
        enterVoteView();
      } else {
        $('login-msg').textContent = 'Sign-in failed. Check your Judge ID and password.';
        $('login-msg').className = 'msg error';
      }
    });

    $('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('vote-creds');
      location.reload();
    });

    async function apiGet(params) {
      const url = new URL(API_URL);
      Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
      const res = await fetch(url.toString(), { method: 'GET' });
      return res.json();
    }

    async function loadOptions() {
      try {
        const data = await apiGet({});
        if (!data.ok || !data.options) return false;
        options = data.options;
        return true;
      } catch (e) {
        return false;
      }
    }

    async function enterVoteView() {
      $('login-view').classList.add('hidden');
      $('vote-view').classList.remove('hidden');
      $('who').textContent = 'Signed in: ' + creds.judgeId;
      $('vote-msg').textContent = '';
      voted = false;
      renderOptions();
      refreshResults();
    }

    function renderOptions() {
      const box = $('options');
      box.innerHTML = '';
      options.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'option-btn';
        b.textContent = opt;
        b.disabled = voted;
        b.addEventListener('click', () => castVote(opt, b));
        box.appendChild(b);
      });
    }

    async function castVote(option, btn) {
      if (voted) return;
      if (!confirm('Vote for "' + option + '"? This cannot be changed.')) return;
      const all = document.querySelectorAll('.option-btn');
      all.forEach(b => b.disabled = true);
      btn.textContent = 'Submitting…';
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ judgeId: creds.judgeId, option: option, password: creds.password }),
          redirect: 'follow'
        });
        const data = await res.json();
        if (data.ok) {
          voted = true;
          $('vote-msg').textContent = '✓ Your vote was recorded.';
          $('vote-msg').className = 'msg ok';
          renderOptions();
          if (data.results) showResults(data.results, data.total);
        } else if (data.error && data.error.toLowerCase().includes('already voted')) {
          voted = true;
          $('vote-msg').textContent = 'You have already voted.';
          $('vote-msg').className = 'msg ok';
          renderOptions();
          refreshResults();
        } else {
          $('vote-msg').textContent = data.error || 'Something went wrong.';
          $('vote-msg').className = 'msg error';
          renderOptions();
        }
      } catch (e) {
        $('vote-msg').textContent = 'Network error — please try again.';
        $('vote-msg').className = 'msg error';
        renderOptions();
      }
    }

    async function refreshResults() {
      try {
        const data = await apiGet({ action: 'results', judgeId: creds.judgeId, password: creds.password });
        if (data.ok && data.results) showResults(data.results, data.total);
      } catch (e) { /* results unavailable */ }
    }

    function showResults(counts, total) {
      const box = $('bars');
      box.innerHTML = '';
      const max = Math.max(1, ...Object.values(counts));
      Object.entries(counts).forEach(([name, n]) => {
        const row = document.createElement('div');
        row.className = 'bar-row';
        row.innerHTML =
          '<div class="bar-label"><span>' + escapeHtml(name) + '</span><span>' + n + '</span></div>' +
          '<div class="bar"><div style="width:' + Math.round((n / max) * 100) + '%"></div></div>';
        box.appendChild(row);
      });
      $('total-line').textContent = 'Total votes: ' + (total ?? Object.values(counts).reduce((a, b) => a + b, 0));
      $('results').classList.remove('hidden');
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>
